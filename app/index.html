<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>V — トラッキング</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14161a; --panel: #1d2026; --line: #2d323b; --fg: #e8eaee; --dim: #9aa1ad; --accent: #7aa7ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
  #stage { position: relative; min-width: 0; }
  #stage[data-bg="green"] { background: #00b140; }
  #stage[data-bg="dark"] { background: #20242b; }
  #stage[data-bg="check"] { background: conic-gradient(#3a3f48 25%, #2c3037 0 50%, #3a3f48 0 75%, #2c3037 0) 0 0 / 32px 32px; }
  #avatar { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #prompt { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 22px; font-weight: 600; text-shadow: 0 2px 8px #000a; pointer-events: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 12px; color: var(--dim); margin: 0 0 6px; font-weight: 600; letter-spacing: .04em; }
  button { background: #2a2f38; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); color: #0b1020; border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #expressions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  select, input[type=range] { width: 100%; }
  select { background: #2a2f38; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  video { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
  .kv { color: var(--dim); font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .kv b { color: var(--fg); font-weight: 500; }
  pre { margin: 0; font-size: 11px; color: var(--dim); white-space: pre-wrap; }
  code { background: #2a2f38; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div id="stage" data-bg="dark">
    <canvas id="avatar"></canvas>
    <div id="prompt"></div>
  </div>
  <aside>
    <h1>V — トラッキング</h1>
    <section>
      <div class="row">
        <button id="start" class="primary" disabled>カメラを開始</button>
        <button id="calibrate">キャリブレーション</button>
      </div>
      <div class="kv" style="margin-top:8px">
        <span>状態</span><b id="status">読み込み中…</b>
        <span>顔</span><b id="face">—</b>
        <span>速度</span><b id="fps">—</b>
        <span>OBS</span><b id="ws">接続待ち…</b>
      </div>
    </section>
    <section>
      <h2>表情（キー 1〜6 でも切り替え）</h2>
      <div id="expressions"></div>
    </section>
    <section>
      <h2>カメラ</h2>
      <video id="cam" playsinline muted></video>
      <label style="margin-top:6px"><input type="checkbox" id="mirror" checked>鏡のように表示</label>
    </section>
    <section>
      <h2>表示</h2>
      <label>背景
        <select id="bg"><option value="dark">暗い</option><option value="green">緑（クロマキー用）</option><option value="check">市松（透過の確認）</option></select>
      </label>
      <label style="margin-top:8px">拡大 <input id="zoom" type="range" min="0.6" max="2.2" step="0.05" value="1"></label>
      <label style="margin-top:8px"><input type="checkbox" id="debug">数値を表示</label>
      <pre id="values"></pre>
    </section>
    <section>
      <h2>OBS</h2>
      <div class="kv" style="grid-template-columns:1fr">
        <span>ブラウザソースの URL:</span>
        <b><code id="obsurl"></code></b>
        <span>幅・高さは配信の画面に合わせ、「カスタム CSS」は空にしてください。</span>
      </div>
    </section>
    <section><button id="resetCalib">キャリブレーションを消す</button></section>
  </aside>
</div>
<script>document.getElementById("obsurl").textContent = location.origin + "/player.html";</script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
